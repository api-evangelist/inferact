aid: inferact
name: Inferact
description: Inferact is an AI inference infrastructure startup founded by the creators and core
  maintainers of vLLM, the most popular open-source LLM inference engine. Its mission is to grow vLLM
  as the world's AI inference engine and to make serving AI models effortless — as simple as spinning
  up a serverless database — by optimizing inference performance across diverse hardware, supporting
  emerging model architectures (mixture-of-experts, multimodal, and agentic), and expanding accelerator
  compatibility while keeping all optimizations flowing back to the open-source community. vLLM supports
  500+ model architectures across 200+ accelerator types with 2,000+ contributors. This profile was
  surfaced as a venture-portfolio lead and enriched with verifiable public identity and domain-security
  signals; the company does not yet publish a public API, developer portal, or specification.
